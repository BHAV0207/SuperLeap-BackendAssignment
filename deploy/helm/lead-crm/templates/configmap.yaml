apiVersion: v1
kind: ConfigMap
metadata:
  name: lead-crm-config
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  APP_ENV: {{ .Values.app.env | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  GIN_MODE: "release"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_SSLMODE: "disable"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  OTEL_SERVICE_NAME: "lead-crm"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
