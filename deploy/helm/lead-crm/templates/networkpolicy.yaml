{{- if .Values.networkPolicy.enabled }}
# Deny all incoming traffic in the namespace by default, then open only
# what each component needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# api: reachable on its http port (users through the NodePort, prometheus for /metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lead-crm-api
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lead-crm.appSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .Values.app.port }}
---
# postgres: only the api pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lead-crm.postgresSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lead-crm.appSelector" . | nindent 14 }}
      ports:
        - port: 5432
---
# redis: only the api pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lead-crm.redisSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lead-crm.appSelector" . | nindent 14 }}
      ports:
        - port: 6379
{{- end }}
