apiVersion: v1
kind: Service
metadata:
  name: lead-crm
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
    {{- include "lead-crm.appSelector" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lead-crm.appSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
