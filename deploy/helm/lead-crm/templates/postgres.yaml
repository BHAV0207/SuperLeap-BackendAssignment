{{- if .Values.postgres.enabled }}
# StatefulSet + PVC so the data survives pod restarts and rescheduling.
# One replica only: postgres replication is out of scope for this project.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
    {{- include "lead-crm.postgresSelector" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "lead-crm.postgresSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
    {{- include "lead-crm.postgresSelector" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "lead-crm.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lead-crm.labels" . | nindent 8 }}
        {{- include "lead-crm.postgresSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid/gid of the postgres user in the alpine image
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "lead-crm.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # read-only root fs, so the socket dir and tmp need writable mounts
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
