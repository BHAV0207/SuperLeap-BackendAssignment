apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-crm
  labels:
    {{- include "lead-crm.labels" . | nindent 4 }}
    {{- include "lead-crm.appSelector" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "lead-crm.appSelector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # bring a new pod up and wait for it to be ready before removing an old one
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "lead-crm.labels" . | nindent 8 }}
        {{- include "lead-crm.appSelector" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.app.image.tag | trunc 63 | quote }}
      annotations:
        # restart pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: lead-crm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "lead-crm.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: lead-crm-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          # the app retries the db for ~30s on boot, give it time before liveness kicks in
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # give the service endpoints time to drop this pod before shutdown starts
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            {{- include "lead-crm.containerSecurity" . | nindent 12 }}
